name: "kyc_approval_pipeline"
version: "1.0.0"
description: "Fintech KYC verification and credit assessment saga workflow"
timeoutSeconds: 300
initialStep: "verify_identity"

steps:
  - id: "verify_identity"
    name: "Verification of Customer Identity"
    order: 1
    service: "verification-service"
    startEvent: "verification.start"
    resultEvent: "verification.result"
    compensateEvent: "verification.compensate"
    timeoutMs: 10000
    retryPolicy:
      maxRetries: 3
      backoffMs: 1000
      exponential: true
    compensation:
      action: "REVERSE_KYC"
      required: true
      timeoutMs: 5000

  - id: "credit_check"
    name: "Credit Score Assessment"
    order: 2
    service: "credit-service"
    startEvent: "credit.start"
    resultEvent: "credit.result"
    compensateEvent: null
    timeoutMs: 10000
    retryPolicy:
      maxRetries: 3
      backoffMs: 1000
      exponential: true
    compensation:
      action: null
      required: false

completionStep:
  name: "approve_loan"
  status: "COMPLETED"
